[package]
name = "tuv-hub"
version = "0.1.0"
edition = "2024"
description = "TU-Varna student hub: schedule, study tools, document assistant, Microsoft sign-in"
license = "MIT"
publish = false

[[bin]]
name = "tuv-hub"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
getrandom = "0.3"
base64 = "0.22"
rust-embed = "8"
mime_guess = "2"
scraper = "0.29"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
miniz_oxide = "0.8"
url = "2"
futures-util = "0.3"
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
